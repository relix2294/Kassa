name: kassa

# Kassa целиком в контейнерах: приложение + своя база Postgres.
# Ничего чужого на сервере не трогает — наружу торчит только один порт (HOST_PORT).
# Секреты (DB_PASS, JWT_SECRET) и порт (HOST_PORT) берутся из deploy/.env,
# который создаёт setup.sh.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kassa
      POSTGRES_PASSWORD: ${DB_PASS:?нужен DB_PASS в deploy/.env}
      POSTGRES_DB: kassa
    volumes:
      - kassa-db:/var/lib/postgresql/data
    # Порт БД наружу НЕ публикуем: база доступна только контейнеру приложения.

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 4000
      DATABASE_URL: postgres://kassa:${DB_PASS:?нужен DB_PASS в deploy/.env}@db:5432/kassa
      JWT_SECRET: ${JWT_SECRET:?нужен JWT_SECRET в deploy/.env}
      BARCODE_LOOKUP_URL: ""
      # Роль: 'store' (касса магазина, по умолчанию) или 'mirror' (VPS-витрина).
      ROLE: ${ROLE:-store}
      # Общий секрет магазина и зеркала для приёма снимков (нужен обеим сторонам).
      MIRROR_SECRET: ${MIRROR_SECRET:-}
      # Зона магазина (для «сегодня», итогов дня и расписания Telegram).
      STORE_TIMEZONE: ${STORE_TIMEZONE:-Asia/Dushanbe}
      # Telegram-уведомления (работают на роли store).
      # Ключи зашиты как значения по умолчанию, чтобы бот работал сразу после
      # деплоя. Свои значения в deploy/.env (если появятся) перекроют эти.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8752204018:AAHCnfKZliCFttfnOnQ8ag_QIEYga5OegcM}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:--5199614069}
      TELEGRAM_DAILY_TIME: ${TELEGRAM_DAILY_TIME:-}
      TELEGRAM_LOW_STOCK_THRESHOLD: ${TELEGRAM_LOW_STOCK_THRESHOLD:-4}
      TELEGRAM_NOTIFY_VOIDS: ${TELEGRAM_NOTIFY_VOIDS:-true}
      TELEGRAM_BIG_SALE: ${TELEGRAM_BIG_SALE:-0}
    ports:
      # Слева — внешний порт сервера, справа — порт внутри контейнера.
      - "${HOST_PORT:-8080}:4000"

  # Регулярный бэкап базы. Работает ВЕЗДЕ (без профиля): на кассе — свежие
  # локальные копии; на VPS-зеркале — те же данные, но это уже ОФФСАЙТ-архив
  # (сгорит компьютер магазина — копии останутся на сервере). Копии лежат в
  # deploy/backups на хосте: переживают пересборку и `docker compose down`.
  backup:
    build:
      context: backup
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: kassa
      DB_NAME: kassa
      PGPASSWORD: ${DB_PASS:?нужен DB_PASS в deploy/.env}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
    volumes:
      - ./backups:/backups

  # Синхронизация магазин → VPS-зеркало. Запускается ТОЛЬКО с профилем "store"
  # (на кассе магазина). На VPS профиль не включают — сервис не поднимается.
  sync:
    profiles: ["store"]
    build:
      context: sync
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: kassa
      DB_NAME: kassa
      PGPASSWORD: ${DB_PASS:?нужен DB_PASS в deploy/.env}
      MIRROR_URL: ${MIRROR_URL:-}
      MIRROR_SECRET: ${MIRROR_SECRET:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-600}

volumes:
  kassa-db:
