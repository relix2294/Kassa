name: Deploy Kassa to VPS

# Деплой запускается ВРУЧНУЮ (по команде) — не на каждый push, чтобы магазин
# не трясло без спроса. Запуск: вкладка Actions → этот workflow → Run workflow,
# либо через GitHub API (Claude запускает по вашему слову).
#
# Что делает: заливает код ветки на сервер в /opt/kassa (НЕ трогая deploy/.env и
# бэкапы) и пересобирает ТОЛЬКО стек Kassa (docker compose project "kassa").
# Marzban и другие контейнеры не затрагиваются.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   VPS_HOST     — IP сервера (напр. 185.18.53.234)
#   VPS_USER     — пользователь SSH (напр. root или deploy)
#   VPS_PASSWORD — пароль SSH (лучше временный/ротируемый)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Ветка с кодом для деплоя'
        required: true
        default: claude/shop-balance-notifications-7jbi4q

concurrency:
  group: deploy-kassa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода нужной ветки
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Установить sshpass и rsync
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Прогреть known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Диагностика секретов (без утечки значений)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "VPS_HOST длина символов: ${#VPS_HOST} (у чистого IP 185.18.53.234 = 13)"
          echo "VPS_USER длина символов: ${#VPS_USER} (у root = 4)"
          echo "VPS_PASSWORD длина символов: ${#SSHPASS} (ожидается 16)"
          printf 'VPS_HOST — только буквы/цифры/точки/дефис: '; printf '%s' "$VPS_HOST" | grep -Eq '^[A-Za-z0-9.-]+$' && echo да || echo НЕТ
          printf 'VPS_HOST содержит пробел/перенос строки: '; printf '%s' "$VPS_HOST" | grep -Eq '[[:space:]]' && echo ДА || echo нет
          printf 'VPS_USER содержит пробел/перенос строки: '; printf '%s' "$VPS_USER" | grep -Eq '[[:space:]]' && echo ДА || echo нет
          printf 'VPS_PASSWORD содержит пробел/перенос строки: '; printf '%s' "$SSHPASS" | grep -Eq '[[:space:]]' && echo ДА || echo нет

      - name: Залить код в /opt/kassa (секреты и бэкапы на сервере не трогаем)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          # Подчистим случайные пробелы/переносы по краям (частая беда при вводе).
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          # У пароля срезаем только перенос строки/возврат каретки (частый артефакт
          # вставки), пробелы внутри пароля не трогаем.
          export SSHPASS="$(printf '%s' "$SSHPASS" | tr -d '\r\n')"
          # --delete убирает с сервера файлы, которых нет в ветке (хвосты от
          # прошлых заливок ломали сборку). deploy/.env и бэкапы защищены
          # excludes — rsync --delete их НЕ трогает.
          sshpass -e rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'web/dist' \
            --exclude 'deploy/.env' --exclude 'deploy/backups' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./ "${VPS_USER}@${VPS_HOST}:/opt/kassa/"

      - name: Прописать токен Telegram в .env (из секрета — не в git, не в логах)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          export SSHPASS="$(printf '%s' "$SSHPASS" | tr -d '\r\n')"
          TG_TOKEN="$(printf '%s' "$TG_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TG_TOKEN" ]; then
            echo "Секрет TELEGRAM_BOT_TOKEN не задан — .env не трогаю (бот будет молчать)."
            exit 0
          fi
          # Токен уходит на сервер ТОЛЬКО по stdin: в аргументах команды и в
          # логах его нет (печатаем лишь длину). На сервере переписываем строку
          # TELEGRAM_BOT_TOKEN= в deploy/.env, остальное в .env не трогаем.
          printf '%s' "$TG_TOKEN" | sshpass -e ssh -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" '
            set -e
            cd /opt/kassa/deploy
            touch .env && chmod 600 .env
            TOK="$(cat)"
            grep -v "^TELEGRAM_BOT_TOKEN=" .env > .env.tmp 2>/dev/null || true
            printf "TELEGRAM_BOT_TOKEN=%s\n" "$TOK" >> .env.tmp
            mv .env.tmp .env
            echo "TELEGRAM_BOT_TOKEN записан в deploy/.env (длина: ${#TOK})."
          '

      - name: Пересобрать и поднять ТОЛЬКО стек Kassa
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" '
            set -e
            cd /opt/kassa/deploy
            docker compose up -d --build
            sleep 6
            echo "--- стек Kassa ---"
            docker compose ps
          '

      - name: Проверка здоровья и сохранности чужих контейнеров
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" '
            PORT=$(grep -E "^HOST_PORT=" /opt/kassa/deploy/.env 2>/dev/null | cut -d= -f2)
            PORT=${PORT:-8080}
            echo "HOST_PORT=$PORT"
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${PORT}/api/health" || echo 000)
            echo "health: $code"
            echo "--- все контейнеры на сервере (убедись, что Marzban и вторая панель на месте) ---"
            docker ps --format "{{.Names}}\t{{.Status}}"
            test "$code" = "200"
          '

      - name: Логи Telegram-слушателя (диагностика)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          export SSHPASS="$(printf '%s' "$SSHPASS" | tr -d '\r\n')"
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" '
            cd /opt/kassa/deploy
            echo "--- строки Telegram из логов app (последние 200) ---"
            docker compose logs app --tail=200 2>&1 | grep -iE "telegram|getupdates|слуша|сводк|чат|webhook|бот @" || echo "(нет telegram-строк в логах)"
          ' || true
