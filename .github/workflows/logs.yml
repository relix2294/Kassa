name: Kassa logs (чтение без перезапуска)

# Только ЧИТАЕТ с сервера. НИЧЕГО не пересобирает и не перезапускает — поэтому
# команды, отправленные боту, не теряются.
#   mode=logs   — Telegram-строки из логов приложения (как раньше);
#   mode=health — проверка «здоровья»: нагрузка, память, диск, контейнеры и их
#                 лимиты, размер базы и таблиц, настройки Postgres, бэкапы,
#                 ошибки в логах. Секреты (.env) не выводятся.
# Запуск: Actions → этот workflow → Run workflow.

on:
  workflow_dispatch:
    inputs:
      tail:
        description: 'Сколько последних строк логов показать'
        required: false
        default: '300'
      mode:
        description: 'logs — логи Telegram; health — проверка сервера и базы'
        required: false
        default: 'logs'

concurrency:
  group: kassa-logs
  cancel-in-progress: false

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Установить sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Логи приложения Kassa
        if: ${{ inputs.mode != 'health' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          TAIL: ${{ inputs.tail }}
        run: |
          export SSHPASS="$(printf '%s' "$SSHPASS" | tr -d '\r\n')"
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          TAIL="$(printf '%s' "${TAIL:-300}" | tr -d '[:space:]')"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" "
            cd /opt/kassa/deploy
            echo '--- Telegram-строки из логов app (последние ${TAIL}) ---'
            docker compose logs app --tail=${TAIL} 2>&1 | grep -iE 'telegram|вход|получено|сводк|getupdates|webhook|бот @|слуша' || echo '(нет telegram-строк)'
          "

      - name: Проверка сервера и базы (только чтение)
        if: ${{ inputs.mode == 'health' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          export SSHPASS="$(printf '%s' "$SSHPASS" | tr -d '\r\n')"
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'EOS'
          cd /opt/kassa/deploy || exit 1
          sec() { echo; echo "===== $1 ====="; }
          psqlq() { docker compose exec -T db psql -U kassa -d kassa -X -A -F ' | ' -P footer=off -c "$1" 2>&1; }

          sec "Сервер: ОС, ядра, нагрузка, аптайм"
          (. /etc/os-release 2>/dev/null; echo "$PRETTY_NAME"); echo "CPU ядер: $(nproc)"; uptime
          sec "Память"
          free -m
          sec "Диск"
          df -h / /var/lib/docker 2>/dev/null | sort -u; echo; df -i / | tail -1
          sec "Самое большое на диске (docker, бэкапы, логи)"
          du -sh /var/lib/docker 2>/dev/null; du -sh /opt/kassa/deploy/backups 2>/dev/null
          echo "файлов бэкапа: $(ls /opt/kassa/deploy/backups 2>/dev/null | wc -l)"; ls -lht /opt/kassa/deploy/backups 2>/dev/null | head -4
          du -sh /var/log 2>/dev/null; journalctl --disk-usage 2>/dev/null
          echo "логи контейнеров (json):"; du -ch /var/lib/docker/containers/*/*-json.log 2>/dev/null | sort -h | tail -6

          sec "Контейнеры"
          docker compose ps --format 'table {{.Name}}\t{{.Status}}\t{{.Image}}'
          sec "Нагрузка контейнеров сейчас"
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}\t{{.BlockIO}}'
          sec "Лимиты и перезапуски контейнеров"
          for c in $(docker compose ps -q); do
            docker inspect -f '{{.Name}}  mem_limit={{.HostConfig.Memory}}  cpus(nano)={{.HostConfig.NanoCpus}}  restarts={{.RestartCount}}  oom_killed={{.State.OOMKilled}}  started={{.State.StartedAt}}  log={{.HostConfig.LogConfig.Type}} {{.HostConfig.LogConfig.Config}}' "$c"
          done
          sec "Docker: место под образы/кэш"
          docker system df
          sec "Роль и порт (без секретов)"
          grep -E '^(ROLE|HOST_PORT|BACKUP_INTERVAL|BACKUP_KEEP|SYNC_INTERVAL)=' .env 2>/dev/null || echo '(не заданы — значения по умолчанию)'

          sec "Скорость ответа приложения"
          PORT=$(grep -E '^HOST_PORT=' .env 2>/dev/null | cut -d= -f2); PORT=${PORT:-8080}
          for i in 1 2 3; do curl -s -o /dev/null -w "health: HTTP %{http_code}  %{time_total}s\n" "http://127.0.0.1:$PORT/api/health"; done
          curl -s -o /dev/null -w "главная: HTTP %{http_code}  %{time_total}s  %{size_download} байт\n" "http://127.0.0.1:$PORT/"

          sec "База: общий размер"
          psqlq "SELECT pg_size_pretty(pg_database_size('kassa')) AS размер_базы"
          sec "База: таблицы (размер, строки, мёртвые строки, автоочистка)"
          psqlq "SELECT relname AS таблица, pg_size_pretty(pg_total_relation_size(relid)) AS размер, n_live_tup AS строк, n_dead_tup AS мёртвых, seq_scan, idx_scan, to_char(GREATEST(last_autovacuum,last_vacuum),'YYYY-MM-DD HH24:MI') AS очистка FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 25"
          sec "База: настройки Postgres"
          psqlq "SELECT name, setting, unit FROM pg_settings WHERE name IN ('shared_buffers','work_mem','effective_cache_size','max_connections','maintenance_work_mem','autovacuum','random_page_cost')"
          sec "База: подключения"
          psqlq "SELECT state, count(*) FROM pg_stat_activity WHERE datname='kassa' GROUP BY state"
          sec "База: долгие запросы прямо сейчас (>2 c)"
          psqlq "SELECT pid, now()-query_start AS идёт, left(query,120) FROM pg_stat_activity WHERE datname='kassa' AND state<>'idle' AND now()-query_start > interval '2 seconds'"
          sec "База: попадание в кэш"
          psqlq "SELECT round(100.0*sum(blks_hit)/nullif(sum(blks_hit)+sum(blks_read),0),2) AS cache_hit_pct FROM pg_stat_database WHERE datname='kassa'"
          sec "База: индексы"
          psqlq "SELECT tablename, indexname FROM pg_indexes WHERE schemaname='public' ORDER BY tablename"

          sec "Ошибки/предупреждения в логах app (последние 2000 строк)"
          docker compose logs app --tail=2000 2>&1 | grep -iE 'error|ошибк|timeout|ECONN|killed|heap|memory|slow' | tail -40 || echo '(нет)'
          sec "Логи db (последние 2000 строк): ошибки"
          docker compose logs db --tail=2000 2>&1 | grep -iE 'error|fatal|panic|checkpoints are occurring|out of memory|no space' | tail -20 || echo '(нет)'
          EOS
